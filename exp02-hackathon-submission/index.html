<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Hackathon project submission form with client-side validation">

    <title>Project Submission | Hackathon</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="page">

        <section class="submission-card">

            <!-- Header -->

            <header class="form-header">

                <p class="eyebrow">
                    HACKATHON 2026
                </p>

                <h1>
                    Submit Your Project
                </h1>

                <p>
                    Tell us about your project before the
                    submission deadline.
                </p>

            </header>


            <!-- Form -->

            <form id="projectForm" novalidate>


                <!-- Project Information -->

                <div class="section-heading">

                    <span>01</span>

                    <h2>Project Information</h2>

                </div>


                <div class="form-grid">


                    <!-- Project Name -->

                    <div class="field full">

                        <label for="projectName">
                            Project Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="projectName"
                            name="projectName"
                            placeholder="e.g. SmartRoute AI">

                        <small
                            class="error"
                            id="projectNameError">
                        </small>

                    </div>


                    <!-- Category -->

                    <div class="field">

                        <label for="category">
                            Category
                            <span>*</span>
                        </label>

                        <select
                            id="category"
                            name="category">

                            <option value="">
                                Select category
                            </option>

                            <option value="AI / ML">
                                AI / ML
                            </option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="Mobile App">
                                Mobile App
                            </option>

                            <option value="Robotics">
                                Robotics
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                        <small
                            class="error"
                            id="categoryError">
                        </small>

                    </div>


                    <!-- Team Size -->

                    <div class="field">

                        <label for="teamSize">
                            Team Size
                            <span>*</span>
                        </label>

                        <input
                            type="number"
                            id="teamSize"
                            name="teamSize"
                            min="1"
                            max="4"
                            placeholder="1 - 4">

                        <small
                            class="error"
                            id="teamSizeError">
                        </small>

                    </div>


                    <!-- Email -->

                    <div class="field">

                        <label for="email">
                            Contact Email
                            <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com">

                        <small
                            class="error"
                            id="emailError">
                        </small>

                    </div>


                    <!-- GitHub -->

                    <div class="field">

                        <label for="github">
                            GitHub Repository
                            <span>*</span>
                        </label>

                        <input
                            type="url"
                            id="github"
                            name="github"
                            placeholder="https://github.com/...">

                        <small
                            class="error"
                            id="githubError">
                        </small>

                    </div>


                    <!-- Submission Date -->

                    <div class="field">

                        <label for="date">
                            Submission Date
                            <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date">

                        <small
                            class="error"
                            id="dateError">
                        </small>

                    </div>

                </div>


                <!-- Technical Details -->

                <div class="section-heading">

                    <span>02</span>

                    <h2>Technical Details</h2>

                </div>


                <div class="form-grid">


                    <!-- Tech Stack -->

                    <div class="field full">

                        <label for="tech">
                            Technology Stack
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="tech"
                            name="tech"
                            placeholder="Python, React, FastAPI, PostgreSQL">

                        <small
                            class="error"
                            id="techError">
                        </small>

                    </div>


                    <!-- Description -->

                    <div class="field full">

                        <label for="description">
                            Project Description
                            <span>*</span>
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Explain what your project does..."></textarea>

                        <small
                            class="error"
                            id="descriptionError">
                        </small>

                    </div>

                </div>


                <!-- Agreement -->

                <div class="agreement">

                    <label>

                        <input
                            type="checkbox"
                            id="terms">

                        I confirm that the information
                        provided is correct.

                    </label>

                    <small
                        class="error"
                        id="termsError">
                    </small>

                </div>


                <!-- Buttons -->

                <div class="actions">

                    <button
                        type="reset"
                        class="btn reset">

                        Clear

                    </button>

                    <button
                        type="submit"
                        class="btn submit">

                        Submit Project →

                    </button>

                </div>

            </form>


            <!-- Success Message -->

            <section
                id="successBox"
                class="success hidden">

            </section>

        </section>

    </main>


    <script src="js/validation.js"></script>

</body>

</html>
