<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Mission Control - JavaScript task management application">

    <title>Mission Control | Task Manager</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="app">

        <!-- =========================
             Header
        ========================== -->

        <header class="app-header">

            <div>

                <p class="eyebrow">
                    PERSONAL WORKSPACE
                </p>

                <h1>
                    Mission Control
                </h1>

                <p id="today">
                    Loading date...
                </p>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                SYSTEM ONLINE

            </div>

        </header>


        <!-- =========================
             Statistics
        ========================== -->

        <section class="stats">

            <article class="stat-card">

                <span class="stat-label">
                    TOTAL
                </span>

                <strong id="totalCount">
                    0
                </strong>

            </article>


            <article class="stat-card">

                <span class="stat-label">
                    ACTIVE
                </span>

                <strong id="activeCount">
                    0
                </strong>

            </article>


            <article class="stat-card">

                <span class="stat-label">
                    COMPLETED
                </span>

                <strong id="completedCount">
                    0
                </strong>

            </article>


            <article class="stat-card">

                <span class="stat-label">
                    PROGRESS
                </span>

                <strong id="progressValue">
                    0%
                </strong>

            </article>

        </section>


        <!-- =========================
             Progress
        ========================== -->

        <section class="progress-section">

            <div class="progress-info">

                <span>
                    Mission Progress
                </span>

                <span id="progressText">
                    0 / 0 tasks
                </span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </section>


        <!-- =========================
             Add Task
        ========================== -->

        <section class="panel">

            <div class="panel-title">

                <span>NEW TASK</span>

                <span class="command">
                    + CREATE
                </span>

            </div>


            <form id="taskForm">

                <div class="input-row">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                        maxlength="100"
                        autocomplete="off">


                    <select id="categoryInput">

                        <option value="Development">
                            Development
                        </option>

                        <option value="AI / ML">
                            AI / ML
                        </option>

                        <option value="Robotics">
                            Robotics
                        </option>

                        <option value="College">
                            College
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                    </select>


                    <select id="priorityInput">

                        <option value="low">
                            Low Priority
                        </option>

                        <option value="medium" selected>
                            Medium Priority
                        </option>

                        <option value="high">
                            High Priority
                        </option>

                    </select>


                    <button type="submit">
                        Add Task
                    </button>

                </div>

                <p id="formError" class="form-error"></p>

            </form>

        </section>


        <!-- =========================
             Toolbar
        ========================== -->

        <section class="toolbar">

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all">

                    All

                </button>

                <button
                    class="filter"
                    data-filter="active">

                    Active

                </button>

                <button
                    class="filter"
                    data-filter="completed">

                    Completed

                </button>

            </div>


            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks...">

        </section>


        <!-- =========================
             Task List
        ========================== -->

        <section class="task-section">

            <ul id="taskList"></ul>


            <div
                id="emptyState"
                class="empty-state">

                <div class="empty-icon">
                    //
                </div>

                <h2>
                    No tasks found
                </h2>

                <p>
                    Your workspace is clear.
                    Add something to work on.
                </p>

            </div>

        </section>


        <!-- =========================
             Footer
        ========================== -->

        <footer class="app-footer">

            <button
                id="clearCompleted"
                class="clear-button">

                Clear completed

            </button>


            <span>
                Data stored locally in your browser
            </span>

        </footer>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
